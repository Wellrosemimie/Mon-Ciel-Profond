<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon Ciel Profond</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Mon Ciel Profond</h1>
    <button id="toggleMode">🌙 Mode Nuit</button>
    <nav>
      <a href="#" onclick="showForm()">Ajouter une observation</a>
    </nav>
  </header>
  <main>
    <section id="formSection" style="display: none;">
      <form id="uploadForm">
        <input type="file" id="imageInput" accept="image/*" required>
        <input type="text" id="titleInput" placeholder="Nom de l'objet" required>
        <input type="date" id="dateInput" required>
        <select id="typeInput" required>
          <option value="">Type d'objet</option>
          <option value="Galaxie">Galaxie</option>
          <option value="Nébuleuse">Nébuleuse</option>
          <option value="Amas">Amas</option>
        </select>
        <textarea id="commentInput" placeholder="Commentaire" rows="4"></textarea>
        <label><input type="checkbox" id="watermark"> Ajouter un filigrane</label>
        <button type="submit">Ajouter à la galerie</button>
      </form>
      <button onclick="hideForm()">⬅️ Retour à l'accueil</button>
    </section>
    <div id="message" style="display: none;">✅ Observation ajoutée !</div>
    <section>
      <div id="filterBar">
        <button onclick="filterType('Tous')">Tous</button>
        <button onclick="filterType('Galaxie')">Galaxies</button>
        <button onclick="filterType('Nébuleuse')">Nébuleuses</button>
        <button onclick="filterType('Amas')">Amas</button>
      </div>
      <div id="gallery"></div>
    </section>
    <div id="modal" class="modal" onclick="closeModal()">
      <span class="close">&times;</span>
      <img class="modal-content" id="modalImg">
    </div>
  </main>
  <footer>
    <p>© Mon Ciel Profond</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
